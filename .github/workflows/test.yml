name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - jsonmap
          - passwordtype
          - encryptedtype
          - ent_jsontype
          - ent_jsonslice
          - ent_jsonmap
          - ent_passwordtype
          - ent_encryptedtype
          - examples
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: vet ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: test ${{ matrix.module }} (race + coverage)
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=cover.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: cover-${{ matrix.module }}
          path: ${{ matrix.module }}/cover.out
          if-no-files-found: ignore
