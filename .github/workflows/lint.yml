# Manual only (owner's call, 2026-10-13: Actions minutes are a budget). To run automatically again, replace the on: block with:
#   on:
#     push:
#       branches: [main]
#     pull_request:

name: lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - jsonmap
          - passwordtype
          - encryptedtype
          - ent_jsontype
          - ent_jsonslice
          - ent_jsonmap
          - ent_passwordtype
          - ent_encryptedtype
          - examples
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: assert gofmt clean
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt issues in:"
            echo "$out"
            exit 1
          fi
